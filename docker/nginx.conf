# OpenTreeLearn 站点：托管 Vite 产物 + 同源反代同步服务。
# 作为 /etc/nginx/conf.d/default.conf 使用（见根 Dockerfile）。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 单批 push 上限 16MB（同步服务 BODY_LIMIT），留出信封余量
    client_max_body_size 20m;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1k;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 同步服务：/lern-api/sync/pull → http://api:3901/api/sync/pull
    location /lern-api/ {
        proxy_pass            http://api:3901/api/;
        proxy_http_version    1.1;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
    }

    # Vite 产物带内容 hash，可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存：发版后立即拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由兜底（/p/:id、/me、/settings 由前端路由接管）
    location / {
        try_files $uri $uri/ /index.html;
    }
}