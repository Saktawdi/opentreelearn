# OpenTreeLearn 站点：托管 Vite 产物 + 同源反代同步服务。
# 作为 /etc/nginx/conf.d/default.conf 使用（见根 Dockerfile）。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 单批 push 上限 16MB（同步服务 BODY_LIMIT），留出信封余量
    client_max_body_size 20m;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1k;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 同步服务：/lern-api/sync/pull → http://api:3901/api/sync/pull
    location /lern-api/ {
        proxy_pass            http://api:3901/api/;
        proxy_http_version    1.1;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
    }

    # LLM 同源代理：请求头 x-llm-proxy-target 里带目标地址，由 nginx 代为访问。
    #
    # 浏览器直连厂商接口会被 CORS 拦下：自建中转（new-api / one-api）常在预检和错误响应上带了
    # Access-Control-Allow-Origin、唯独流式回答没带，于是上游日志显示「成功且有输出」，浏览器
    # 却抛 No 'Access-Control-Allow-Origin'。走同源就没有跨域判定这回事。
    # 前端实现见 src/services/llm/proxy.ts，开发环境由 Vite 中间件提供等价实现。
    location = /api-proxy {
        # 目标必须是绝对 http(s) 地址，否则 proxy_pass 会拼出非法地址
        if ($http_x_llm_proxy_target = "") {
            return 400;
        }
        if ($http_x_llm_proxy_target !~* "^https?://") {
            return 400;
        }

        # 这个入口不鉴权（密钥在请求头里、由上游校验），别被当成内网探测跳板：
        # 拒掉环回 / 私网 / 链路本地（含云厂商 169.254.169.254 元数据地址），以及不带点的
        # 主机名（compose 里的服务名 api、web 就走这类）。
        if ($http_x_llm_proxy_target ~* "^https?://(localhost|127\.|0\.0\.0\.0|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.|\[::1\])") {
            return 403;
        }
        if ($http_x_llm_proxy_target ~* "^https?://[^./?#:]+([:/?#]|$)") {
            return 403;
        }

        # proxy_pass 里带了变量，nginx 不在启动时解析域名，要靠 resolver 现查。
        # 127.0.0.11 是 compose 网络内置的 DNS（它会把公网域名转给宿主机解析）；
        # 若把本镜像单独跑在 compose 之外，换成 1.1.1.1 之类即可。
        resolver 127.0.0.11 valid=30s ipv6=off;

        # 变量形式的 proxy_pass 不带 URI 部分，nginx 会把原始请求 URI（就是 /api-proxy）送给
        # 上游。这里要的恰恰是「目标地址本身」当 URI，所以用变量当 URI —— ngx_http_proxy_eval
        # 会从里面解析出 host、path 和 query，原样送给上游。
        proxy_pass $http_x_llm_proxy_target;

        # $proxy_host 只覆盖 Host 头；默认的 HTTP/1.0 会让上游忽略 SSE 的连接语义
        proxy_http_version 1.1;
        proxy_set_header   Host $proxy_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 这个内部头不需要往上游带
        proxy_set_header   X-Llm-Proxy-Target "";
        # 让上游回未压缩内容：SSE 与 JSON 都别掺一层压缩，省掉缓冲/分块的边界情况
        proxy_set_header   Accept-Encoding "";

        # 上游可能是 HTTPS（newapi.sakta.top 之类）。proxy_ssl_server_name 默认 off，同 IP
        # 多站点会取错证书，必须开；证书校验默认也是 off，打开并指定 alpine 的 CA 包路径
        # （nginx:alpine 已装 ca-certificates）。浏览器本就会拦坏证书，这里不放松。
        proxy_ssl_server_name       on;
        proxy_ssl_verify            on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth      2;

        # 流式回答要边收边发，否则 nginx 攒满缓冲区才开始吐字
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        # 推理模型可能几十秒不出第一个 token；SSE 期间每读到一次数据都会重置计时
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Vite 产物带内容 hash，可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存：发版后立即拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由兜底（/p/:id、/me、/settings 由前端路由接管）
    location / {
        try_files $uri $uri/ /index.html;
    }
}